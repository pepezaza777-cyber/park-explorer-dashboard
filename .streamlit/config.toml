[theme]
base = "light"
primaryColor = "#25664c"
backgroundColor = "#f5f4ed"
secondaryBackgroundColor = "#e9ede3"
textColor = "#233b30"
font = "sans serif"

# หน้านี้ออกแบบบนพื้นครีม ใช้สีข้อความเข้มทั้งสองโหมด
# เพื่อรองรับเบราว์เซอร์ที่เคยเลือก Dark ไว้
[theme.light]
primaryColor = "#25664c"
backgroundColor = "#f5f4ed"
secondaryBackgroundColor = "#e9ede3"
textColor = "#233b30"

[theme.dark]
primaryColor = "#25664c"
backgroundColor = "#f5f4ed"
secondaryBackgroundColor = "#e9ede3"
textColor = "#233b30"
